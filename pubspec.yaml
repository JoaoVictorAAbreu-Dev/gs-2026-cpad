name: pulso
description: PULSO — Radar Territorial. Painel de inteligência territorial (GS 2026.2 · CPAD · FIAP).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Estado global/local com AsyncValue (loading/erro/dados) e testável sem BuildContext.
  flutter_riverpod: ^2.6.1
  # Rotas nomeadas, parâmetros de caminho e StatefulShellRoute (4 abas com estado preservado).
  go_router: ^14.6.2
  # HTTP com timeout e erros tipados.
  dio: ^5.7.0
  # Preferências, consentimento, limiares e cache da última série.
  shared_preferences: ^2.3.3
  # Formatação pt_BR (vírgula decimal, datas). `any` evita conflito com o pin de flutter_localizations.
  intl: any
  flutter_local_notifications: ^23.0.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
  # Inter 4.0 (SIL OFL 1.1) — tipografia do design system; embutida para funcionar offline.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Regular.otf
        - asset: assets/fonts/inter/Inter-Medium.otf
          weight: 500
        - asset: assets/fonts/inter/Inter-SemiBold.otf
          weight: 600
        - asset: assets/fonts/inter/Inter-Bold.otf
          weight: 700
        - asset: assets/fonts/inter/Inter-ExtraBold.otf
          weight: 800
