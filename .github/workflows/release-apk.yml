name: Build and release APK

# Gera o APK de release em uma máquina limpa (verifica, testa e compila) e anexa ao GitHub Releases.
# Dispara com uma tag v* (ex.: v1.0.0) ou manualmente pela aba Actions.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      - name: Dependências
        run: flutter pub get

      - name: Análise estática
        run: flutter analyze

      - name: Testes
        run: flutter test

      - name: Compilar APK de release
        run: flutter build apk --release

      - name: Nomear o APK
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          cp build/app/outputs/flutter-apk/app-release.apk "PULSO-v${VERSION}.apk"
          sha256sum "PULSO-v${VERSION}.apk" > "PULSO-v${VERSION}.apk.sha256"
          echo "APK_NAME=PULSO-v${VERSION}.apk" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: |
            ${{ env.APK_NAME }}
            ${{ env.APK_NAME }}.sha256

      - name: Publicar no GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: PULSO ${{ github.ref_name }}
          body_path: docs/RELEASE_NOTES.md
          files: |
            ${{ env.APK_NAME }}
            ${{ env.APK_NAME }}.sha256
